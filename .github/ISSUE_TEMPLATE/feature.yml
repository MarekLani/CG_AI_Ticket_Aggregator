name: Feature / change request
description: New functionality or a change to existing behavior.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true

  - type: textarea
    id: outofscope
    attributes:
      label: Out of scope

  - type: textarea
    id: notes
    attributes:
      label: Context, risks, and open questions
